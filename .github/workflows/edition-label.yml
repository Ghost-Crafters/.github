name: Edition label

# Reusable workflow for the public repos. Call it when an issue is opened or edited:
#
#   on:
#     issues:
#       types: [opened, edited]
#   jobs:
#     edition:
#       permissions:
#         issues: write
#       uses: Ghost-Crafters/.github/.github/workflows/edition-label.yml@master

on:
  workflow_call:

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    concurrency:
      group: edition-label-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Only the parser from this repo is checked out. The caller's code and the issue text are never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Ghost-Crafters/.github
          ref: master
          sparse-checkout: tools/edition_label.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set the edition label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Read the current issue, not the event payload, so a queued older event can't bring back an old answer.
          gh issue view "$ISSUE_NUMBER" --json body,labels > "$RUNNER_TEMP/issue.json"
          body_file="$RUNNER_TEMP/issue-body.txt"
          jq -r .body "$RUNNER_TEMP/issue.json" > "$body_file"
          attached=$(jq -r '.labels[].name' "$RUNNER_TEMP/issue.json")
          label=$(python3 tools/edition_label.py "$body_file")
          # Only issues from the bug report and feature request forms have the Edition heading; anything else is left alone.
          if [ -z "$label" ] && ! grep -q '^### Edition[[:space:]]*$' "$body_file"; then
            echo "Not an issue from the forms, nothing to label."
            exit 0
          fi
          # Only labels the issue has are removed, so a failed removal is a real error and stops the job.
          for other in edition:bedrock edition:java; do
            if [ "$other" != "$label" ] && grep -qxF -- "$other" <<< "$attached"; then
              gh issue edit "$ISSUE_NUMBER" --remove-label "$other"
            fi
          done
          if [ -z "$label" ]; then
            echo "No edition answer in the issue, edition labels removed."
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "$label"
