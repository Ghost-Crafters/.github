name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '@claude review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
    steps:
      - name: Check the Claude secret
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as an org secret"
            exit 1
          fi
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          read -r sha base head_repo < <(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" \
            --json headRefOid,baseRefName,headRepository,headRepositoryOwner \
            --jq '[.headRefOid, .baseRefName, (.headRepositoryOwner.login + "/" + .headRepository.name)] | @tsv')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests from forks aren't reviewed"
            exit 1
          fi
          { echo "number=$NUMBER"; echo "sha=$sha"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: ${{ github.event_name == 'pull_request' }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}
            HEAD COMMIT: ${{ steps.pr.outputs.sha }}
            BASE BRANCH: ${{ steps.pr.outputs.base }}

            Review this pull request at HEAD COMMIT. The repo is checked out at that commit with full history.
            Read the diff (`gh pr diff`), the description and linked issues (`gh pr view`, `gh issue view`),
            the commits (`git log origin/${{ steps.pr.outputs.base }}..HEAD`) and any file you need for context.
            If the repo has a README, CONTRIBUTING or docs folder, hold the change to what they say.

            Report only real problems. Each one is an inline comment on the line it's about, starting with its
            severity and a short title, then what is wrong and what to change:
            - P0: can break or wipe a Minecraft world, server, player data or a published release, or leaks a secret
            - P1: a bug, a security hole, a missing check on untrusted input, a test that can't fail, or a change
              that doesn't do what its issue asks
            - P2: should be fixed before merging: missed edge cases (empty, missing or malformed input, limits,
              reruns, restarts), missing tests, docs that no longer match, unlinked file or repo names
            - P3: minor: naming, clarity, house style (em dashes, emoji, filler words such as seamless, robust,
              leverage, ensure or utilize)
            Also check: workflow permissions are minimal and actions are pinned to a commit; no personal info,
            home folder paths or agent files are added; every commit references the issue it fixes.

            Say plainly what is wrong and what to change. No praise, no summary of what the PR does, no
            comments on lines the PR didn't touch unless the change breaks them.

            Return the structured result with the commit you reviewed, the count per severity and a short
            summary of the findings, or "No findings." when there are none.
          claude_args: |
            --model claude-sonnet-5-5
            --permission-mode default
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,Bash(git add:*),Bash(git rm:*),Bash(git commit:*),Bash(git push:*)"
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"commit":{"type":"string"},"p0":{"type":"integer","minimum":0},"p1":{"type":"integer","minimum":0},"p2":{"type":"integer","minimum":0},"p3":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["commit","p0","p1","p2","p3","summary"]}'
      - name: Check the review result
        if: always() && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude finished with '${CONCLUSION:-nothing}', not success"
            exit 1
          fi
          if ! jq -e 'has("commit") and has("p0") and has("p1")' <<<"${RESULT:-null}" >/dev/null; then
            echo "::error::Claude returned no review result"
            exit 1
          fi
          commit=$(jq -r .commit <<<"$RESULT")
          read -r p0 p1 p2 p3 < <(jq -r '[.p0, .p1, .p2, .p3] | @tsv' <<<"$RESULT")
          {
            echo "### Claude review of ${HEAD_SHA:0:7}"
            echo
            echo "| P0 | P1 | P2 | P3 |"
            echo "|---|---|---|---|"
            echo "| $p0 | $p1 | $p2 | $p3 |"
            echo
            jq -r .summary <<<"$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $((p0 + p1 + p2 + p3)) -eq 0 ]; then
            counts="no findings"
          else
            counts="P0 $p0, P1 $p1, P2 $p2, P3 $p3"
          fi
          body=$(printf '<!-- claude-review -->\n**Claude review of %s:** %s\n\n%s\n' \
            "${commit:0:7}" "$counts" "$(jq -r .summary <<<"$RESULT")")
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body" >/dev/null
          fi
          case "$HEAD_SHA" in
            "$commit"*) ;;
            *) echo "::error::Claude reviewed '$commit', not the head commit $HEAD_SHA"; exit 1 ;;
          esac
          if [ "${#commit}" -lt 7 ]; then
            echo "::error::Claude reported commit '$commit', too short to match the head commit"
            exit 1
          fi
          if [ $((p0 + p1)) -gt 0 ]; then
            echo "::error::$p0 P0 and $p1 P1 findings must be fixed before merging"
            exit 1
          fi
