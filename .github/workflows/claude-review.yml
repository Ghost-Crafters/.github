name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Report only real problems, each as an inline comment on the line it is about:
            - bugs, wrong behavior and missed edge cases (empty, missing or malformed input, limits, reruns)
            - security: secrets, personal info or home folder paths in the diff, unsafe workflow permissions, actions not pinned to a commit
            - anything that could damage a Minecraft world, server or player data, or remove it without a way back
            - tests that are missing for a change, or tests that only exercise mocks
            - docs or comments that no longer match the code, and named files, repos or pages that aren't linked
            - text that breaks the house style: em dashes, emoji, filler words such as seamless, robust, leverage, ensure or utilize
            - a commit that doesn't reference the issue it fixes

            Say plainly what is wrong and what to change. No praise and no summary of what the PR does. If you find nothing, post one short comment saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
